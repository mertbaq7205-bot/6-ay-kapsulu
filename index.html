<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6. Ayımız & Anı Kapsülümüz</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-rose-50 min-h-screen text-slate-800 pb-12">

    <!-- Header -->
    <header class="bg-white shadow-sm py-6 px-4 text-center mb-8">
        <h1 class="text-2xl font-bold text-rose-600">Bizim Kapsülümüz 🤍</h1>
        <p class="text-sm text-slate-500 mt-1">Anılarımız artık tamamen bulutta ve anlık senkronize!</p>
    </header>

    <main class="max-w-xl mx-auto px-4 space-y-6">
        
        <!-- İçerik Ekleme Formu -->
        <div class="bg-white p-6 rounded-2xl shadow-sm space-y-4">
            <h2 class="font-semibold text-slate-700">Kapsüle Bir Şey Ekle</h2>
            
            <textarea id="itemText" rows="3" placeholder="Tatlı bir not veya anı yaz..." class="w-full p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-400 text-sm"></textarea>
            
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Fotoğraf (İsteğe bağlı)</label>
                <input type="file" id="itemImage" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-rose-50 file:text-rose-700 hover:file:bg-rose-100 cursor-pointer">
            </div>

            <button onclick="uploadItem()" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-medium py-3 rounded-xl transition shadow-sm text-sm">
                Kapsüle Gönder ✨
            </button>
        </div>

        <!-- Anıların Listelendiği Alan -->
        <div class="space-y-4">
            <h2 class="font-semibold text-slate-700">Ortak Anılarımız</h2>
            <div id="capsuleList" class="space-y-4">
                <!-- Veriler Firebase'den otomatik gelecek -->
                <p class="text-center text-slate-400 text-sm py-8">Yükleniyor...</p>
            </div>
        </div>

    </main>

    <!-- Firebase SDK (Modular v9) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Senin Firebase Yapılandırman
        const firebaseConfig = {
            apiKey: "AIzaSyAwaiC_ILi04GGwjh4JHP8cX-NrZmmZFs0",
            authDomain: "mert-nehir-kapsul.firebaseapp.com",
            projectId: "mert-nehir-kapsul",
            storageBucket: "mert-nehir-kapsul.firebasestorage.app",
            messagingSenderId: "855962483803",
            appId: "1:855962483803:web:c3a95a9a88df1ec023537e"
        };

        // Firebase Başlatma
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Global Fonksiyonlar (HTML içinden çağrılabilmesi için)
        window.uploadItem = async function() {
            const text = document.getElementById('itemText').value;
            const imageInput = document.getElementById('itemImage');
            
            if (!text && imageInput.files.length === 0) {
                alert("Lütfen bir şeyler yaz veya fotoğraf seç!");
                return;
            }

            let imageUrl = "";
            if (imageInput.files.length > 0) {
                const file = imageInput.files[0];
                imageUrl = await toBase64(file); // Görseli küçük boyutlu Base64 formatına çeviriyoruz
            }

            try {
                await addDoc(collection(db, "capsuleItems"), {
                    text: text,
                    imageUrl: imageUrl,
                    createdAt: new Date()
                });

                document.getElementById('itemText').value = "";
                document.getElementById('itemImage').value = "";
            } catch (e) {
                console.error("Hata oluştu: ", e);
                alert("Yüklenirken bir hata oluştu.");
            }
        };

        // Resmi base64 formatına çeviren yardımcı fonksiyon
        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // Firestore'dan verileri anlık (real-time) dinleme
        const q = query(collection(db, "capsuleItems"), orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            const listEl = document.getElementById('capsuleList');
            listEl.innerHTML = "";

            if (snapshot.empty) {
                listEl.innerHTML = `<p class="text-center text-slate-400 text-sm py-8">Henüz anı eklenmemiş. İlk anıyı sen ekle! 🤍</p>`;
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                let html = `
                    <div class="bg-white p-5 rounded-2xl shadow-sm space-y-3">
                        ${data.text ? `<p class="text-slate-700 text-sm whitespace-pre-wrap">${escapeHtml(data.text)}</p>` : ''}
                        ${data.imageUrl ? `<img src="${data.imageUrl}" class="rounded-xl w-full max-h-80 object-cover mt-2">` : ''}
                        <span class="text-[10px] text-slate-400 block text-right">${data.createdAt ? new Date(data.createdAt.toDate()).toLocaleString('tr-TR') : ''}</span>
                    </div>
                `;
                listEl.innerHTML += html;
            });
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
